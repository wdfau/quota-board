<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"
    />
    <title>Quota Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside>
      <div class="brand">
        <span class="brand-mark">◔</span>
        <div>Quota Board<small>给每个账号，留一点余量</small></div>
      </div>
      <nav aria-label="服务筛选" id="navigation"></nav>
      <div class="sidebar-bottom">
        <span class="local-dot"></span> 数据留在这台设备<small
          >订阅额度 · v0.1.0</small
        >
      </div>
    </aside>
    <main>
      <header>
        <div class="breadcrumb">工作台 <span>/</span> 订阅额度</div>
        <button id="demo" class="subtle">试用演示</button>
      </header>
      <section class="intro">
        <div>
          <h1>安心开工。</h1>
          <p>所有账号的余量，在这里看一眼。</p>
        </div>
        <div class="actions">
          <button id="refresh">↻ 刷新额度</button
          ><button class="primary" id="add">＋ 添加账号</button>
        </div>
      </section>
      <div id="demo-banner" class="banner" hidden>
        演示模式 · 下方为虚拟账号和虚拟额度，可随时返回你的账号。
      </div>
      <section class="overview" aria-label="概况" id="overview"></section>
      <div class="section-label">
        <h2 id="section-title">全部账号</h2>
        <span>各服务按自己的额度周期展示</span>
      </div>
      <section id="accounts" class="accounts" aria-live="polite"></section>
      <footer>
        余量来自服务查询或本地记录。到达重置时间后，刷新确认最新额度。
      </footer>
    </main>
    <dialog id="profile-dialog">
      <form id="profile-form">
        <div class="dialog-heading">
          <h2>添加订阅账号</h2>
          <button
            type="button"
            class="close"
            data-close="profile-dialog"
            aria-label="关闭"
          >
            ×
          </button>
        </div>
        <label
          >服务<select name="provider" id="provider">
            <option value="codex">Codex</option>
            <option value="claude">Claude</option>
            <option value="cursor">Cursor</option>
            <option value="copilot">GitHub Copilot</option>
          </select></label
        >
        <label
          >账号名称<input
            name="label"
            required
            maxlength="60"
            placeholder="例如 工作号、个人号"
        /></label>
        <label>数据来源<select name="mode" id="mode"></select></label>
        <p id="mode-help" class="help"></p>
        <label id="home-field"
          >独立配置目录（可选）
          <div class="path-row">
            <input name="home" placeholder="留空使用官方 CLI 当前登录" /><button
              type="button"
              data-pick="home"
              data-kind="directory"
            >
              选择
            </button>
          </div></label
        >
        <label id="cli-field"
          >CLI 程序路径（可选）
          <div class="path-row">
            <input name="cliPath" placeholder="自动寻找已安装的 CLI" /><button
              type="button"
              data-pick="cliPath"
            >
              选择
            </button>
          </div></label
        >
        <label id="snapshot-field"
          >Claude 额度记录文件
          <div class="path-row">
            <input name="snapshotPath" placeholder="claude-quota.json" /><button
              type="button"
              data-pick="snapshotPath"
            >
              选择
            </button>
          </div></label
        >
        <p class="help">
          每个账号分别添加。官方客户端负责登录，操作指引见仓库 README。
        </p>
        <button type="submit" class="primary full">添加账号</button>
      </form>
    </dialog>
    <dialog id="record-dialog">
      <form id="record-form">
        <div class="dialog-heading">
          <h2>更新额度记录</h2>
          <button
            type="button"
            class="close"
            data-close="record-dialog"
            aria-label="关闭"
          >
            ×
          </button>
        </div>
        <p class="help">先在官方用量页确认数字。手动记录会显示填写时间。</p>
        <label
          >额度周期<input
            name="period"
            required
            maxlength="80"
            value="本月订阅额度"
        /></label>
        <label
          >剩余百分比<input
            name="remaining"
            type="number"
            min="0"
            max="100"
            step="0.1"
            required
        /></label>
        <label
          >重置时间（可选）<input name="resetsAt" type="datetime-local"
        /></label>
        <button type="submit" class="primary full">保存记录</button>
      </form>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
